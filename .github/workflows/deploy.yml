name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  REGION: us-central1
  SERVICE_NAME: triage-app

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and Push Docker Image
        run: |
          set -euo pipefail
          PROJECT_ID="$(printf '%s' "${{ secrets.GCP_PROJECT_ID }}" | tr -d '[:space:]')"
          REPO_URL="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.SERVICE_NAME }}"
          IMAGE_TAG="${REPO_URL}/app:${{ github.sha }}"
          LATEST_TAG="${REPO_URL}/app:latest"

          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "${{ env.IMAGE_TAG }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1
